# Flutter sablonunun varsayilani -Xmx8G idi. Kotlin derleyici daemon'u da
# ayni degeri devraliyordu; 15 GB'lik bir makinede iki daemon birlikte 16 GB
# tavan istedigi icin cekirdek OOM killer devreye girip Gradle daemon'unu
# (ve yanindaki uygulamalari) oldurdu. Degerler bu proje icin yeterli.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
