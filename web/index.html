<!DOCTYPE html>
<html>
<head>
  <!--

    The path provided below has to start and end with a slash "/" in order for

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ortak not oturumlari: paylasilan checkbox listeleri ve anlik bildirimler.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ortak Notlar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ortak Notlar</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3D5AFE">
</head>
<body>
  <style>
    body { margin: 0; background: #FAFAFC; }
    @media (prefers-color-scheme: dark) { body { background: #131318; } }
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; font: 14px system-ui, sans-serif; color: #8A8A9A;
    }
  </style>
  <div id="boot">Yukleniyor…</div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) boot.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
